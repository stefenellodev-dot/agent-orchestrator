server:
  host: "0.0.0.0"
  port: 8080

# storage: "memory" for local skeleton, "postgres" for persistent runs
store:
  kind: "memory"

database:
  dsn: "postgres://orchestrator:orchestrator@localhost:5432/orchestrator?sslmode=disable"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: "1h"

worktree:
  root_path: "/var/lib/agent-orchestrator/worktrees"
  retain_days: 7
  retain_failed_days: 30

opencode:
  binary_path: "opencode"
  model: "opencode-go/deepseek-v4-flash"
  default_timeout: "20m"
  agents:
    discovery: "plan"
    decision: "plan"
    implementation: "build"
    validation: "build"

concurrency:
  # MVP default: one active WorkItem per project.
  max_active_per_project: 1

auth:
  enabled: true
  username: "admin"
  password: "changeme"

web:
  enabled: true
  static_path: "./web/dist"

feature:
  # Test-only escape hatch. MUST stay false in production.
  auto_approve_for_tests: false

# Orchestrator-owned project definitions. Consumer repositories need no changes
# and no agent/plugin is ever installed inside them.
projects:
  - name: "condosmart"
    repo_path: "/Users/stefenello/development/movil"
    base_branch: "master"
    validation_commands:
      - "test -f docs/features/notificaciones-i18n.md"
      - "if git diff --name-only $(git merge-base master HEAD)..HEAD | grep -q '[.]dart$'; then echo unexpected-dart-source-change; exit 1; fi"
    lint_commands:
      - "git diff --check $(git merge-base master HEAD)..HEAD"
  - name: "agent-orchestrator"
    repo_path: "/Users/stefenello/development/agent-orchestrator"
    base_branch: "main"
    # Objective self-validation. Requires the pinned Go toolchain mounted into
    # the worker (see docs/deployment-piave.md).
    validation_commands:
      - "go test ./..."
      - "go test -race ./..."
      - "go vet ./..."
  - name: "fin-engine-v1"
    repo_path: "/Users/stefenello/development/fin-engine-desa"
    base_branch: "qa"
    validation_commands: []
    lint_commands: []
